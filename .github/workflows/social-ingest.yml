name: Social Media Ingest

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Fetch official social metadata
        env:
          INSTAGRAM_MEDIA_ENDPOINT: ${{ secrets.INSTAGRAM_MEDIA_ENDPOINT }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
        run: node scripts/social-ingest.mjs

      - name: Commit changed feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/majang-mejeng/public/media/social-feed.json
          if git diff --cached --quiet; then
            echo 'No social feed changes.'
            exit 0
          fi
          git commit -m 'chore: refresh social media feed'
          git push
